<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Syllabus System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container animate-fade-in" style="margin-top: 60px;">
  <div class="flex justify-between items-center mb-4">
    <div>
      <h2 id="dashboardTitle">Dashboard</h2>
      <p id="dashboardDesc" class="text-sm">Loading portal...</p>
    </div>
  </div>
  
  <div class="card">
    <table class="table" id="syllabusTable">
      <thead>
        <tr>
          <th>Course Code</th>
          <th>Course Title</th>
          <th>Department</th>
          <th>Faculty</th>
          <th>Status</th>
          <th>Last Updated</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7" style="text-align: center;">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const user = JSON.parse(localStorage.getItem('user'));
    
    const titleEl = document.getElementById('dashboardTitle');
    const descEl = document.getElementById('dashboardDesc');
    
    if (user.role === 'Faculty') {
      titleEl.innerText = '👨‍🏫 Faculty Portal';
      descEl.innerText = 'Create drafts, edit modules, submit for approval, and track status.';
    } else {
      titleEl.innerText = `🛡️ ${user.role} Portal`;
      descEl.innerText = 'Review submissions, approve/reject, add remarks, and view audit trails.';
    }

    try {
      const syllabi = await api.getSyllabi();
      renderTable(syllabi, user);
    } catch (err) {
      alert('Error loading dashboard: ' + err.message);
    }
  });

  function renderTable(syllabi, user) {
    const tbody = document.getElementById('tableBody');
    if (syllabi.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No syllabous found.</td></tr>';
      return;
    }

    tbody.innerHTML = syllabi.map(s => {
      let actions = '';
      
      // View action is always available
      actions += `<a href="approval.html?id=${s._id}" class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.875rem; margin-right: 0.5rem;">View</a>`;
      
      if (user.role === 'Faculty' && s.status === 'Draft') {
        actions += `<a href="faculty_form.html?id=${s._id}" class="btn btn-primary" style="padding: 0.25rem 0.5rem; font-size: 0.875rem;">Edit</a>`;
      }
      
      if (s.status === 'Approved') {
        actions += `<button onclick="downloadPdf('${s._id}', '${s.courseCode}')" class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.875rem; margin-left: 0.5rem;">PDF</button>`;
      }

      return `
        <tr>
          <td><strong>${s.courseCode}</strong></td>
          <td>${s.courseTitle}</td>
          <td>${s.department}</td>
          <td>${s.faculty.name}</td>
          <td>${getStatusBadge(s.status)}</td>
          <td>${new Date(s.updatedAt).toLocaleDateString()}</td>
          <td>${actions}</td>
        </tr>
      `;
    }).join('');
  }

  async function downloadPdf(id, code) {
    try {
      await api.downloadPdf(id, code);
    } catch (err) {
      alert('Failed to download PDF');
    }
  }
</script>
</body>
</html>
